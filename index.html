<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมุดบันทึกเคสประจำวัน</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div class="wrap">
<header>
  <h1>📒 สมุดบันทึกเคสประจำวัน</h1>
  <div class="me">ฉันคือ <select id="me" style="width:auto"></select></div>
</header>
<div class="tabs">
  <button class="tab on" data-t="cases">เคสทั้งหมด</button>
  <button class="tab" data-t="admin">🔒 หลังบ้าน</button>
</div>

<section id="casesView">
  <div class="bar">
    <input id="q" class="full" type="search" placeholder="ค้นหา ชื่อเคส เลขเคส รายละเอียด อัพเดท ผู้รับผิดชอบ">
    <input id="fdate" type="date" aria-label="วันที่">
    <select id="fowner"></select>
    <select id="fstatus"><option value="">ทุกสถานะ</option><option>กำลังดำเนินการ</option><option>รอส่งต่อ</option><option>เสร็จสิ้น</option></select>
  </div>
  <div class="row" style="margin-bottom:12px">
    <button class="btn" id="add">+ เพิ่มเคส</button>
    <button class="btn ghost" id="today">เฉพาะวันนี้</button>
    <button class="btn ghost" id="all">ทุกวัน</button>
    <button class="btn ghost" id="reload">↻ รีเฟรช</button>
    <span id="count" class="meta"></span>
  </div>
  <div id="list"><div class="empty">กำลังโหลด...</div></div>
</section>

<section id="adminView" hidden>
  <div class="note">หลังบ้าน: เพิ่มรายชื่อผู้ใช้งานที่จะเลือกเป็นผู้รับผิดชอบเคส</div>
  <div class="row" style="margin-bottom:12px"><input id="newName" placeholder="ชื่อ เช่น สมชาย" style="flex:1"><button class="btn" id="addStaff">เพิ่มชื่อ</button></div>
  <div id="staffList"></div>
</section>
</div>

<dialog id="dlg">
  <h3 id="dlgTitle" style="margin:0"></h3>
  <label>เลขเคส</label><input id="fNo">
  <label>ชื่อเคส / หัวข้อ</label><input id="fTitle">
  <label>รายละเอียด</label><textarea id="fDetail"></textarea>
  <div class="row"><div style="flex:1"><label>วันที่</label><input id="fDate" type="date"></div>
  <div style="flex:1"><label>สถานะ</label><select id="fStatus"><option>กำลังดำเนินการ</option><option>รอส่งต่อ</option><option>เสร็จสิ้น</option></select></div></div>
  <label>ผู้รับผิดชอบ (เปลี่ยนเพื่อส่งต่อเคส)</label><select id="fOwner"></select>
  <label>ผู้ร่วมเคส (เลือกได้หลายคน)</label><div id="fMembers" class="checks"></div>
  <div class="row" style="justify-content:space-between;margin-top:16px">
    <button class="btn danger" id="del">ลบเคส</button>
    <span class="row"><button class="btn ghost" id="cancel">ยกเลิก</button><button class="btn" id="save">บันทึก</button></span>
  </div>
</dialog>
<div class="toast" id="toast"></div>
<script src="app.js?v=4"></script>
</body>
</html>
